                                            <button className="px-6 py-4 rounded-xl bg-slate-700 hover:bg-slate-600 text-white font-semibold transition-colors flex items-center gap-2">
                                                <i data-lucide="phone" className="w-5 h-5"></i>
                                                Contact Customer
                                            </button>
                                        </div>
                                    </div>
                                ) : deliveryStatus === 'navigating' ? (
                                    <DeliveryNavigationView 
                                        route={todayRoute}
                                        onComplete={handleCompleteDelivery}
                                        actualDifficulties={actualDifficulties}
                                        setActualDifficulties={setActualDifficulties}
                                    />
                                ) : (
                                    <DeliveryCompletionView 
                                        finalPoints={finalPoints}
                                        onReset={() => {
                                            setDeliveryStatus('not_started');
                                            setFinalPoints(null);
                                            setActualDifficulties({
                                                liftBroken: false,
                                                parkingWorse: false,
                                                trafficWorse: false,
                                                accessWorse: false,
                                                stairsWorse: false
                                            });
                                        }}
                                    />
                                )}
                            </div>
                        ) : (
                            <DriverPreferences />
                        )}
                    </div>
                </div>
            );
        }

        // Driver Preferences Component – choose difficulties, then order only the chosen ones
        function DriverPreferences() {
            const allFactors = [
                { key: 'longDistance', label: 'Long Distance (>15km)', icon: 'map-pin' },
                { key: 'heavyPackages', label: 'Heavy Packages (>20kg)', icon: 'weight' },
                { key: 'stairs', label: 'Climbing Stairs (>3 floors)', icon: 'stairs' },
                { key: 'parking', label: 'No / Difficult Parking', icon: 'car' },
                { key: 'access', label: 'Complex Building Access', icon: 'building-2' },
                { key: 'traffic', label: 'High Traffic Areas', icon: 'activity' },
                { key: 'multipleStops', label: 'Multiple Deliveries / Stops', icon: 'package' },
                { key: 'timeSensitive', label: 'Time-Sensitive Deliveries', icon: 'clock' }
            ];

            const [selectedKeys, setSelectedKeys] = useState([
                'stairs',
                'heavyPackages',
                'longDistance'
            ]);

            useEffect(() => {
                lucide.createIcons();
                const storedSel = localStorage.getItem('driverSelectedFactors');
                const storedOrder = localStorage.getItem('driverPreferenceOrder_v3');
                if (storedSel) {
                    try {
                        const parsed = JSON.parse(storedSel);
                        if (Array.isArray(parsed) && parsed.length) setSelectedKeys(parsed);
                    } catch {}
                } else if (storedOrder) {
                    try {
                        const parsed = JSON.parse(storedOrder);
                        if (Array.isArray(parsed) && parsed.length) setSelectedKeys(parsed);
                    } catch {}
                }
            }, []);

            const moveKey = (key, delta) => {
                const idx = selectedKeys.indexOf(key);
                if (idx === -1) return;
                const newIndex = idx + delta;
                if (newIndex < 0 || newIndex >= selectedKeys.length) return;
                const updated = [...selectedKeys];
                const temp = updated[newIndex];
                updated[newIndex] = updated[idx];
                updated[idx] = temp;
                setSelectedKeys(updated);
            };

            const toggleSelected = (key) => {
                setSelectedKeys(prev => {
                    if (prev.includes(key)) {
                        if (prev.length === 1) return prev; // keep at least one
                        return prev.filter(k => k !== key);
                    }
                    return [...prev, key];
                });
            };

            const rankToMultiplier = (rank, max) => {
                const t = (rank - 1) / Math.max(1, max - 1);
                return 2.0 - 1.0 * t; // 2.0 down to 1.0
            };

            const handleSave = () => {
                const chosenCount = selectedKeys.length || 1;
                const ordered = selectedKeys.map((key, index) => ({
                    key,
                    rank: index + 1,
                    multiplier: Number(rankToMultiplier(index + 1, chosenCount).toFixed(2))
                }));

                const neutral = allFactors
                    .filter(f => !selectedKeys.includes(f.key))
                    .map(f => ({ key: f.key, rank: null, multiplier: 1.0 }));

                const fullPayload = [...ordered, ...neutral];

                localStorage.setItem('driverSelectedFactors', JSON.stringify(selectedKeys));
                localStorage.setItem('driverPreferenceOrder_v3', JSON.stringify(selectedKeys));
                localStorage.setItem('driverPreferenceScales', JSON.stringify(fullPayload));

                alert('Preferences saved. Only selected factors are treated as difficult; others stay neutral.');
            };

            const handleReset = () => {
                setSelectedKeys(['stairs', 'heavyPackages', 'longDistance']);
                localStorage.removeItem('driverSelectedFactors');
                localStorage.removeItem('driverPreferenceOrder_v3');
                localStorage.removeItem('driverPreferenceScales');
            };

            return (
                <div className="bg-slate-800/50 backdrop-blur-sm rounded-2xl border border-slate-700 p-8">
                    <h3 className="text-2xl font-bold text-white mb-6 flex items-center gap-3">
                        <i data-lucide="star" className="w-6 h-6 text-orange-400"></i>
                        Arrange Your Difficulty Factors
                    </h3>

                    <p className="text-slate-300 mb-4">
                        Tick only the difficulty types that really bother you, then use the arrows to order the{" "}
                        <span className="font-semibold text-white">selected</span> ones from{" "}
                        <span className="font-semibold text-white">hardest (Rank 1)</span> to{" "}
                        <span className="font-semibold text-white">easiest (last)</span>.
                        Unselected factors are neutral (×1.0).
                    </p>

                    <div className="space-y-3">
                        {allFactors.map(factor => {
                            const index = selectedKeys.indexOf(factor.key);
                            const isSelected = index !== -1;
                            const rank = isSelected ? index + 1 : null;
                            const multiplier = isSelected
                                ? rankToMultiplier(rank, selectedKeys.length).toFixed(2)
                                : '1.00';

                            return (
                                <div
                                    key={factor.key}
                                    className="flex items-center justify-between p-4 rounded-xl bg-slate-900/60 border border-slate-700"
                                >
                                    <div className="flex items-center gap-3">
                                        <input
                                            type="checkbox"
                                            checked={isSelected}
                                            onChange={() => toggleSelected(factor.key)}
                                            className="w-4 h-4 text-orange-400 rounded border-slate-600 bg-slate-800"
                                        />
                                        <div className="w-9 h-9 rounded-lg bg-slate-800 flex items-center justify-center">
                                            <i data-lucide={factor.icon} className="w-5 h-5 text-cyan-400"></i>
                                        </div>
                                        <div>
                                            <div className="text-white font-semibold">{factor.label}</div>
                                            <div className="text-xs text-slate-400">
                                                {isSelected
                                                    ? `Rank ${rank} — 1 is hardest for you`
                                                    : 'Not marked as difficult for you (neutral)'}
                                            </div>
                                        </div>
                                    </div>

                                    <div className="flex items-center gap-3">
                                        <div className="px-3 py-1 rounded-full bg-slate-800 text-xs text-orange-300 border border-slate-600">
                                            Multiplier ×{multiplier}
                                        </div>
                                        <div className="flex flex-col gap-1">
                                            <button
                                                onClick={() => moveKey(factor.key, -1)}
                                                disabled={!isSelected}
                                                className={`w-8 h-8 rounded-lg text-xs ${
                                                    isSelected
                                                        ? 'bg-slate-800 hover:bg-slate-700 text-slate-200'
                                                        : 'bg-slate-900 text-slate-600 cursor-not-allowed'
                                                }`}
                                            >
                                                ↑
                                            </button>
                                            <button
                                                onClick={() => moveKey(factor.key, 1)}
                                                disabled={!isSelected}
                                                className={`w-8 h-8 rounded-lg text-xs ${
                                                    isSelected
                                                        ? 'bg-slate-800 hover:bg-slate-700 text-slate-200'
                                                        : 'bg-slate-900 text-slate-600 cursor-not-allowed'
                                                }`}
                                            >
                                                ↓
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            );
                        })}
                    </div>

                    <div className="mt-8 p-6 rounded-xl bg-gradient-to-br from-orange-500/20 to-red-500/20 border border-orange-500/50">
                        <h4 className="text-lg font-semibold text-white mb-3">How this connects to scoring</h4>
                        <p className="text-sm text-slate-200">
                            Selected difficulties get multipliers based on their rank (hardest ≈ ×2.0, easiest ≈ ×1.0). Neutral factors stay at ×1.0.
                            The allocation logic uses these multipliers as a soft signal on top of the AI difficulty points so that hard routes are spread fairly.
                        </p>
                    </div>

                    <div className="flex gap-4 mt-8">
                        <button
                            onClick={handleSave}
                            className="flex-1 py-4 rounded-xl bg-gradient-to-r from-orange-500 to-red-500 hover:from-orange-600 hover:to-red-600 text-white font-semibold transition-all transform hover:scale-105 flex items-center justify-center gap-2"
                        >
                            <i data-lucide="check-circle" className="w-5 h-5"></i>
                            Save Ordered Preferences
                        </button>
                        <button
                            onClick={handleReset}
                            className="px-6 py-4 rounded-xl bg-slate-700 hover:bg-slate-600 text-white font-semibold transition-colors"
                        >
                            Reset to Default
                        </button>
                    </div>
                </div>
            );
        }

        // Render the app
        ReactDOM.render(<FairDispatchSystem />, document.getElementById('root'));
    </script>
</body>
</html>
